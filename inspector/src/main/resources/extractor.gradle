def emit = { project ->
    def isAndroid = project.plugins.hasPlugin('com.android.application') ||
            project.plugins.hasPlugin('com.android.library')
    if (!isAndroid) return

    def androidExt = project.extensions.findByName('android')
    if (androidExt == null) return

    def compileSdk = androidExt.hasProperty('compileSdk') ? androidExt.compileSdk : androidExt.hasProperty('compileSdkVersion') ? androidExt.compileSdkVersion : null
    def buildTools = androidExt.hasProperty('buildToolsVersion') ? androidExt.buildToolsVersion : null
    def ndkVersion = androidExt.hasProperty('ndkVersion') ? androidExt.ndkVersion : null

    // Whether this module actually *compiles* native code, which is the only thing that makes the
    // NDK a real requirement. AGP populates android.ndkVersion with its own bundled default on
    // every project, native or not, so that field alone is not evidence — reading it as evidence
    // is what pulled a ~1GB NDK into images for repos with no native sources at all.
    //
    // externalNativeBuild.cmake.path / .ndkBuild.path is the signal: it is set only when the build
    // points AGP at a CMakeLists.txt or Android.mk to build. Read off the evaluated extension, not
    // build-file text, so modules configured by convention plugins in build-logic are covered.
    // Deliberately ignored: jniLibs prebuilts, defaultConfig.ndk.abiFilters, and native libs inside
    // consumed AARs — AGP only strips those, and merely warns when no NDK is installed.
    def nativeBuild = null
    def cmakeVersion = null
    try {
        def enb = androidExt.externalNativeBuild
        def kinds = []
        if (enb?.cmake?.path != null) kinds << 'cmake'
        if (enb?.ndkBuild?.path != null) kinds << 'ndkBuild'
        if (!kinds.isEmpty()) nativeBuild = kinds.join('+')
        cmakeVersion = enb?.cmake?.version
    } catch (Throwable ignored) {
        // No externalNativeBuild on this AGP's extension — treat as "not native" rather than
        // guessing, which is the same conclusion for every AGP that lacks the block.
    }

    def agpVersion = null
    def defaultCmake = null
    try {
        // androidExt (not project) so the lookup happens on AGP's own plugin classloader —
        // project.class.classLoader is Gradle core's, which never sees AGP's classes.
        def agpClassLoader = androidExt.class.classLoader
        agpVersion = agpClassLoader.loadClass('com.android.Version')
                .getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null)
        // The CMake version AGP falls back to when a cmake module pins none. Read from AGP itself
        // so a future AGP that moves its default needs no change here; NativeBuildResolver carries
        // the documented constant for when this internal class is not reachable.
        defaultCmake = agpClassLoader.loadClass('com.android.build.gradle.internal.cxx.configure.CMakeVersion')
                .getField('DEFAULT').get(null).sdkFolderName
    } catch (Throwable ignored) {
        // AGP not resolvable this way — leave null, AGP-minimum-JDK fallback simply won't
        // have a version to work with for this project.
    }

    // {{PREFIX}} will be replaced at runtime
    println "{{PREFIX}}path=${project.path}::compileSdk=${compileSdk}::buildTools=${buildTools}::ndk=${ndkVersion}::agpVersion=${agpVersion}::nativeBuild=${nativeBuild}::cmakeVersion=${cmakeVersion}::defaultCmake=${defaultCmake}"
}

// Runs for every project, Android or not — a plain Kotlin/Java module can still pin a JDK
// via a toolchain, which feeds JdkResolver.
//
// Deliberately NOT reading plain JavaPluginExtension.targetCompatibility/sourceCompatibility
// here: unlike toolchain's Property<JavaLanguageVersion> (absent unless explicitly set), those
// fields eagerly default to JavaVersion.current() — the JVM running the daemon — when a build
// doesn't configure them. Trusting that value would silently reintroduce host-JVM dependence,
// which is exactly the bug this extraction exists to avoid. Confirmed empirically: a module
// with no explicit compatibility setting reported whatever JDK the extracting daemon ran on.
def emitJdk = { project ->
    def androidExt = project.extensions.findByName('android')

    def javaExt = project.extensions.findByType(org.gradle.api.plugins.JavaPluginExtension)
    def toolchain = null
    def javaTarget = null
    try {
        toolchain = javaExt?.toolchain?.languageVersion?.orNull?.asInt()
    } catch (Throwable ignored) { }
    try {
        javaTarget = androidExt?.compileOptions?.targetCompatibility?.majorVersion?.toInteger()
    } catch (Throwable ignored) { }

    def kotlinExt = project.extensions.findByName('kotlin')
    def kotlinToolchain = null
    def kotlinTarget = null
    if (kotlinExt != null) {
        try {
            kotlinToolchain = kotlinExt.jvmToolchain?.get()?.languageVersion?.get()?.asInt()
        } catch (Throwable ignored) { }
        try {
            kotlinTarget = kotlinExt.compilerOptions?.jvmTarget?.orNull?.target?.toInteger()
        } catch (Throwable ignored) { }
        if (kotlinTarget == null) {
            try {
                // Legacy Kotlin Gradle Plugin: kotlinOptions.jvmTarget on each compile task, e.g. "17".
                kotlinTarget = project.tasks
                        .withType(org.gradle.api.Task)
                        .findAll { it.hasProperty('kotlinOptions') }
                        .collect { it.kotlinOptions?.jvmTarget }
                        .findAll { it != null }
                        .collect { it.toInteger() }
                        .max()
            } catch (Throwable ignored) { }
        }
    }

    // {{JDK_PREFIX}} will be replaced at runtime
    println "{{JDK_PREFIX}}path=${project.path}::toolchain=${toolchain}::kotlinToolchain=${kotlinToolchain}::javaTarget=${javaTarget}::kotlinTarget=${kotlinTarget}"
}

// allprojects { afterEvaluate { ... } } reaches across the project graph, which
// Isolated Projects forbids. gradle.lifecycle.afterProject (Gradle 8.7+) is the
// isolation-safe per-project replacement; older Gradle falls back to allprojects.
if (org.gradle.util.GradleVersion.current() >= org.gradle.util.GradleVersion.version('8.7')) {
    gradle.lifecycle.afterProject { project ->
        emit(project)
        emitJdk(project)
    }
} else {
    allprojects {
        afterEvaluate { project ->
            emit(project)
            emitJdk(project)
        }
    }
}
