name: Repository Matrix Test

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test-repo:
    name: Test ${{ matrix.repo.name }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        repo:
          - {
              name: "Sunflower",
              url: "https://github.com/android/sunflower.git",
            }
          - {
              name: "Now In Android",
              url: "https://github.com/android/nowinandroid.git",
            }
          - { name: "Timber", url: "https://github.com/JakeWharton/timber.git" }
          - {
              name: "Signal",
              url: "https://github.com/signalapp/Signal-Android.git",
            }
          - {
              name: "Wikipedia",
              url: "https://github.com/wikimedia/apps-android-wikipedia.git",
            }

    steps:
      - name: Checkout Gradlezilla
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Clone Target Repository
        run: git clone --depth 1 ${{ matrix.repo.url }} target-repo

      - name: Build Gradlezilla
        run: ./gradlew :cli:installDist

      - name: Run Gradlezilla
        id: run-cli
        run: |
          # Invoke the installed distribution directly rather than `./gradlew :cli:run` —
          # this project's own build.gradle.kts pins all subprojects to a JDK 17
          # toolchain, so a Gradle-managed run task ignores JAVA_HOME entirely and
          # always executes under JDK 17 regardless of what setup-java installs here.
          # The installed script has no such toolchain and honors JAVA_HOME, which is
          # what lets a target repo's own JDK requirements actually take effect.
          if cli/build/install/gradlezilla/bin/gradlezilla generate "$PWD/target-repo"; then
            echo "status=✅ Success" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
          fi

      - name: Upload Generated Dockerfile
        if: steps.run-cli.outputs.status == '✅ Success'
        uses: actions/upload-artifact@v7
        with:
          name: dockerfile-${{ strategy.job-index }}
          path: target-repo/Dockerfile
          retention-days: 1

      - name: Save Result to Markdown
        run: |
          echo "| ${{ matrix.repo.name }} | ${{ steps.run-cli.outputs.status }} |" > result-${{ strategy.job-index }}.md

      - name: Upload Result Artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-result-${{ strategy.job-index }}
          path: result-${{ strategy.job-index }}.md
          retention-days: 1

  generate-report:
    name: Generate Markdown Report
    needs: test-repo
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gradlezilla
        uses: actions/checkout@v6
        with:
          ref: main
          ssh-key: ${{ secrets.MATRIX_README_DEPLOY_KEY }}

      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          pattern: test-result-*
          merge-multiple: true
          path: results/

      - name: Compile Markdown Table
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          COMMIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          {
            echo "Last verified at commit [\`$SHORT_SHA\`]($COMMIT_URL)."
            echo
            echo "| Repository | Status |"
            echo "|---|---|"
            cat results/*.md
          } | tee matrix-table.md
          echo "### Gradlezilla Matrix Report" >> $GITHUB_STEP_SUMMARY
          cat matrix-table.md >> $GITHUB_STEP_SUMMARY

      - name: Update README
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import re, pathlib

          table = pathlib.Path("matrix-table.md").read_text()
          readme = pathlib.Path("README.md")
          content = readme.read_text()
          content = re.sub(
              r"(<!-- MATRIX-TABLE:START -->\n).*(\n<!-- MATRIX-TABLE:END -->)",
              lambda m: m.group(1) + table + m.group(2),
              content,
              flags=re.S,
          )
          readme.write_text(content)
          PY

      - name: Commit and push README
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update matrix test results in README"
            git push origin HEAD:main
          fi
